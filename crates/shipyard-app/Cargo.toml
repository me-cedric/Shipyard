[package]
name = "shipyard-app"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "shipyard_app"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# Already in the tree through `url`: compares names that macOS and git store in different Unicode forms.
icu_normalizer = "2.4"
serde.workspace = true
tauri.workspace = true
tauri-specta.workspace = true
specta.workspace = true
shipyard-agents = { path = "../shipyard-agents" }
shipyard-core = { path = "../shipyard-core" }
shipyard-engine = { path = "../shipyard-engine" }
shipyard-forges = { path = "../shipyard-forges" }
shipyard-git = { path = "../shipyard-git" }
shipyard-http = { path = "../shipyard-http" }
shipyard-mcp = { path = "../shipyard-mcp" }
shipyard-secrets = { path = "../shipyard-secrets" }
shipyard-store = { path = "../shipyard-store" }
shipyard-trackers = { path = "../shipyard-trackers" }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
notify = "8"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

# Already in the tree through `wry`: the PDF export of a deck prints the webview to a file (ADR 0016).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSGeometry", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }

[dev-dependencies]
specta-typescript.workspace = true
tempfile = "3.27.0"
