[package]
name = "shipyard-agents"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
shipyard-core = { path = "../shipyard-core" }
shipyard-git = { path = "../shipyard-git" }
shipyard-http = { path = "../shipyard-http" }
shipyard-secrets = { path = "../shipyard-secrets" }
base64 = "0.22"
serde.workspace = true
specta = { workspace = true, features = ["derive"] }
serde_json = "1"
thiserror = "2"

# `killpg` ends the whole process group of an MCP server (`npx` starts grandchildren).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
