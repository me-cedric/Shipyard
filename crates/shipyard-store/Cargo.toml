[package]
name = "shipyard-store"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde.workspace = true
specta = { workspace = true, features = ["derive"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
base64 = "0.22"
ring = "0.17"
thiserror = "2"
shipyard-core = { version = "0.1.0", path = "../shipyard-core" }
calamine = "0.37.0"
rust_xlsxwriter = "0.102.0"
docx-rs = "0.4.22"
# Same version and features as docx-rs, so the lock does not change.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
