id = "GHSA-m665-v7pm-7grj"
ignoreUntil = 2027-01-29
reason = "Reaches `zip` 8.6.0 only through `docx-rs` 0.4.22 (pinned to zip 8), whose reader Shipyard never calls: it only writes .docx. Shipyard's own `zip` is 9.1.3. The flaw is in the streaming reader and `extract`."

