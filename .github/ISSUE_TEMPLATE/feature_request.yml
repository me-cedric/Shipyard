name: Feature request
description: Suggest a new feature for Shipyard.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Say what is hard or missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Say what you want Shipyard to do.
    validations:
      required: true
  - type: dropdown
    id: roles
    attributes:
      label: Who it helps
      description: Pick every role that gains from this.
      multiple: true
      options:
        - Project manager
        - Architect
        - Developer
        - Tester
        - Business analyst
        - Functional lead
        - Junior
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Say what you tried or considered.
    validations:
      required: false
